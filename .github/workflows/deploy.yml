# Publica el portfolio en GitHub Pages en cada push a main.
# No hay que compilar en local ni subir la carpeta dist: GitHub la construye.
name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:      # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Las variables VITE_ se incrustan en el JavaScript al compilar, asi
      # que tienen que existir AQUI, no en el servidor. Son publicas por
      # diseno; los secretos de verdad viven dentro de Supabase.
      # Si un secreto no esta puesto, queda vacio y el formulario avisa de
      # que no esta conectado en vez de romperse.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_CAL_LINK: ${{ secrets.VITE_CAL_LINK }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
